<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keth • Portfólio de Links & Projetos</title>
  <meta name="description" content="Portfólio profissional de Keth - Desenvolvedora de sistemas. Organizado por trimestres." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone to compile JSX directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbar and animations */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(120, 120, 120, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(120, 120, 120, 0.5);
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased selection:bg-indigo-500/30 selection:text-indigo-200 min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Default configuration with 3 Trimesters
    const DEFAULT_PORTFOLIO = {
      profile: {
        name: "Keth",
        role: "Desenvolvedora de sistemas",
        bio: "Criando experiências digitais memoráveis, desenvolvedora de sistemas.",
        avatarUrl: "",
        location: "Arapongas, Paraná, Brasil",
        email: "contato@keth.dev",
        availableForWork: true,
        statusText: "Em busca de novos desafios e conexões",
        socialLinks: [
          { id: "github", platform: "GitHub", url: "https://github.com", icon: "Github", label: "github.com/keth" },
          { id: "linkedin", platform: "LinkedIn", url: "https://linkedin.com", icon: "Linkedin", label: "linkedin.com/in/keth" },
          { id: "whatsapp", platform: "WhatsApp", url: "https://wa.me/", icon: "MessageCircle", label: "Falar no WhatsApp" },
          { id: "email", platform: "E-mail", url: "mailto:contato@keth.dev", icon: "Mail", label: "contato@keth.dev" }
        ]
      },
      categories: [
        { id: "1-trimestre", name: "1º Trimestre", description: "Sites e projetos do 1º trimestre", icon: "Calendar" },
        { id: "2-trimestre", name: "2º Trimestre", description: "Sites e projetos do 2º trimestre", icon: "Calendar" },
        { id: "3-trimestre", name: "3º Trimestre", description: "Sites e projetos do 3º trimestre", icon: "Calendar" }
      ],
      links: [],
      theme: "dark",
      layoutStyle: "cards"
    };

    const STORAGE_KEY = "keth_portfolio_links_v1";

    // SVG Icon Component
    function Icon({ name, className = "w-4 h-4" }) {
      switch (name) {
        case "Globe":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          );
        case "Code2":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
          );
        case "Terminal":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <polyline points="4 17 10 11 4 5" />
              <line x1="12" y1="19" x2="20" y2="19" />
            </svg>
          );
        case "BarChart3":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <line x1="18" y1="20" x2="18" y2="10" />
              <line x1="12" y1="20" x2="12" y2="4" />
              <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
          );
        case "Layers":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <polygon points="12 2 2 7 12 12 22 7 12 2" />
              <polyline points="2 17 12 22 22 17" />
              <polyline points="2 12 12 17 22 12" />
            </svg>
          );
        case "Github":
          return (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
              <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
          );
        case "Linkedin":
          return (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.64 1.64 0 1 0 0 3.28 1.64 1.64 0 0 0 0-3.28z" />
            </svg>
          );
        case "MessageCircle":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
          );
        case "Mail":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          );
        case "Calendar":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          );
        case "ExternalLink":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <polyline points="15 3 21 3 21 9" />
              <line x1="10" y1="14" x2="21" y2="3" />
            </svg>
          );
        case "Copy":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          );
        case "Check":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <polyline points="20 6 9 17 4 12" />
            </svg>
          );
        case "Trash2":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
          );
        case "Plus":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          );
        case "Search":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          );
        case "X":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          );
        case "MapPin":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
          );
        case "Download":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          );
        case "Sparkles":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
            </svg>
          );
        case "Send":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          );
        default:
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
          );
      }
    }

    const QUICK_ICONS = [
      { id: "Globe", label: "Site / Web" },
      { id: "Code2", label: "Sistema / Dev" },
      { id: "Terminal", label: "Terminal / App" },
      { id: "BarChart3", label: "Dashboard" },
      { id: "Layers", label: "Design" },
      { id: "Github", label: "GitHub" },
      { id: "Send", label: "Contato" },
      { id: "Link", label: "Outro" }
    ];

    // Main App Component
    function App() {
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.profile && Array.isArray(parsed.categories) && Array.isArray(parsed.links)) {
              // Ensure max 3 trimesters
              parsed.categories = parsed.categories.filter(c => c.id !== '4-trimestre');
              parsed.links = parsed.links.filter(l => l.categoryId !== '4-trimestre');
              return parsed;
            }
          }
        } catch (e) {
          console.warn("Usando configuração padrão:", e);
        }
        return DEFAULT_PORTFOLIO;
      });

      const [activeCategory, setActiveCategory] = useState("all");
      const [selectedCategoryId, setSelectedCategoryId] = useState("1-trimestre");
      const [searchQuery, setSearchQuery] = useState("");
      const [layoutStyle, setLayoutStyle] = useState("cards");
      const [themeMode, setThemeMode] = useState("dark");
      const [copiedId, setCopiedId] = useState(null);

      // Form state for adding new site
      const [title, setTitle] = useState("");
      const [url, setUrl] = useState("");
      const [description, setDescription] = useState("");
      const [selectedIcon, setSelectedIcon] = useState("Globe");
      const [badge, setBadge] = useState("");
      const [tagsText, setTagsText] = useState("");
      const [showAdvanced, setShowAdvanced] = useState(false);
      const [addedSuccess, setAddedSuccess] = useState(false);

      // Save to localStorage whenever config changes
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        } catch (e) {
          console.error("Erro ao salvar:", e);
        }
      }, [config]);

      // Apply theme mode class to <html>
      useEffect(() => {
        const root = document.documentElement;
        if (themeMode === 'light') {
          root.classList.remove('dark');
          document.body.className = "bg-slate-50 text-slate-900 font-sans antialiased min-h-screen transition-colors duration-300";
        } else {
          root.classList.add('dark');
          document.body.className = "bg-neutral-950 text-neutral-100 font-sans antialiased min-h-screen transition-colors duration-300";
        }
      }, [themeMode]);

      // Add link handler
      const handleAddLink = (e) => {
        e.preventDefault();
        if (!title.trim() || !url.trim()) return;

        let cleanUrl = url.trim();
        if (!cleanUrl.startsWith("http://") && !cleanUrl.startsWith("https://") && !cleanUrl.startsWith("mailto:")) {
          cleanUrl = `https://${cleanUrl}`;
        }

        const tags = tagsText
          ? tagsText.split(",").map(t => t.trim()).filter(Boolean)
          : [];

        const newLink = {
          id: `site-${Date.now()}`,
          title: title.trim(),
          url: cleanUrl,
          description: description.trim() || undefined,
          categoryId: selectedCategoryId || "1-trimestre",
          icon: selectedIcon,
          badge: badge.trim() || undefined,
          tags: tags.length > 0 ? tags : undefined,
          clicks: 0
        };

        setConfig(prev => ({
          ...prev,
          links: [newLink, ...prev.links]
        }));

        setTitle("");
        setUrl("");
        setDescription("");
        setBadge("");
        setTagsText("");
        setAddedSuccess(true);
        setTimeout(() => setAddedSuccess(false), 3000);
      };

      // Delete link handler
      const handleDeleteLink = (id) => {
        if (confirm("Deseja realmente remover este site do portfólio?")) {
          setConfig(prev => ({
            ...prev,
            links: prev.links.filter(l => l.id !== id)
          }));
        }
      };

      // Copy link URL
      const handleCopyLink = (linkUrl, id) => {
        navigator.clipboard.writeText(linkUrl).then(() => {
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 2000);
        });
      };

      // Select trimester and scroll to form
      const handleAddInTrimester = (catId) => {
        setSelectedCategoryId(catId);
        const el = document.getElementById("add-new-site-section");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      // Download self-contained standalone index.html with current links embedded
      const handleDownloadStandalone = () => {
        // Clone the current full document HTML
        const currentDataScript = JSON.stringify(config, null, 2);
        let htmlContent = document.documentElement.outerHTML;
        
        // Ensure default data in the downloaded HTML includes currently added links
        htmlContent = htmlContent.replace(
          /const DEFAULT_PORTFOLIO = \{[\s\S]*?\n    \};/,
          `const DEFAULT_PORTFOLIO = ${currentDataScript};`
        );

        const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = "index.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
      };

      // Filtered links
      const filteredLinks = useMemo(() => {
        return config.links.filter(link => {
          const matchCat = activeCategory === "all" || link.categoryId === activeCategory;
          const q = searchQuery.toLowerCase().trim();
          const matchSearch = !q ||
            link.title.toLowerCase().includes(q) ||
            (link.description && link.description.toLowerCase().includes(q)) ||
            link.url.toLowerCase().includes(q) ||
            (link.tags && link.tags.some(t => t.toLowerCase().includes(q))) ||
            (link.badge && link.badge.toLowerCase().includes(q));

          return matchCat && matchSearch;
        });
      }, [config.links, activeCategory, searchQuery]);

      const shouldGroupByCategory = activeCategory === "all" && !searchQuery;

      return (
        <div className="min-h-screen pb-20 relative">
          {/* Top Bar Header */}
          <header className="sticky top-0 z-30 backdrop-blur-xl border-b border-neutral-800/80 bg-neutral-950/70 dark:bg-neutral-950/80">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 font-bold text-sm">
                  K
                </div>
                <div>
                  <h1 className="text-sm font-bold leading-none">{config.profile.name}</h1>
                  <span className="text-[11px] text-neutral-400">Portfólio por Trimestres</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {/* Download Standalone File Button */}
                <button
                  type="button"
                  onClick={handleDownloadStandalone}
                  className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1.5 shadow-md shadow-indigo-600/20 transition-all cursor-pointer"
                  title="Baixar este arquivo index.html completo para seu computador"
                >
                  <Icon name="Download" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Baixar index.html</span>
                  <span className="sm:hidden">Baixar</span>
                </button>

                {/* Theme Toggle Button */}
                <button
                  type="button"
                  onClick={() => setThemeMode(themeMode === "dark" ? "light" : "dark")}
                  className="p-2 rounded-xl border border-neutral-800 bg-neutral-900/60 hover:bg-neutral-800 text-neutral-300 text-xs transition-colors cursor-pointer"
                  title="Alternar tema claro/escuro"
                >
                  {themeMode === "dark" ? "☀️" : "🌙"}
                </button>

                {/* Layout Toggle */}
                <button
                  type="button"
                  onClick={() => setLayoutStyle(layoutStyle === "cards" ? "compact" : "cards")}
                  className="p-2 rounded-xl border border-neutral-800 bg-neutral-900/60 hover:bg-neutral-800 text-neutral-300 text-xs transition-colors cursor-pointer hidden sm:flex"
                  title="Alternar modo de exibição (cartões ou lista compacta)"
                >
                  {layoutStyle === "cards" ? "☰ Lista" : "☷ Cards"}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-4 pt-8">
            {/* Profile Card */}
            <div className="p-6 rounded-3xl border border-neutral-800 bg-neutral-900/50 backdrop-blur-sm mb-6 shadow-xl relative overflow-hidden">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2.5 mb-1.5">
                    <h2 className="text-2xl font-black tracking-tight">{config.profile.name}</h2>
                    <span className="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400">
                      Disponível
                    </span>
                  </div>

                  <p className="text-sm font-semibold text-indigo-400 mb-2">
                    {config.profile.role}
                  </p>

                  <p className="text-xs text-neutral-400 max-w-lg mb-3">
                    {config.profile.bio}
                  </p>

                  <div className="flex items-center gap-1.5 text-xs text-neutral-400">
                    <Icon name="MapPin" className="w-3.5 h-3.5 text-rose-400" />
                    <span>{config.profile.location}</span>
                  </div>
                </div>

                {/* Social Badges */}
                <div className="flex flex-wrap sm:flex-col gap-2 shrink-0">
                  {config.profile.socialLinks.map(soc => (
                    <a
                      key={soc.id}
                      href={soc.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-1.5 rounded-xl text-xs font-medium border border-neutral-800 bg-neutral-950/80 hover:bg-neutral-800 text-neutral-300 hover:text-white flex items-center gap-1.5 transition-all"
                    >
                      <Icon name={soc.icon} className="w-3.5 h-3.5 text-indigo-400" />
                      <span>{soc.platform}</span>
                    </a>
                  ))}
                </div>
              </div>
            </div>

            {/* Espaço para Adicionar Novos Sites */}
            <div
              id="add-new-site-section"
              className="p-5 sm:p-6 rounded-3xl border border-neutral-800 bg-neutral-900/60 backdrop-blur-md mb-8 shadow-xl"
            >
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shrink-0">
                    <Icon name="Plus" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-base font-bold flex items-center gap-2">
                      <span>Espaço para Adicionar Novos Sites</span>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                        Novo
                      </span>
                    </h3>
                    <p className="text-xs text-neutral-400">
                      Insira o nome, link e selecione o trimestre do site
                    </p>
                  </div>
                </div>

                {addedSuccess && (
                  <span className="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                    <Icon name="Check" className="w-3.5 h-3.5" />
                    <span>Site Adicionado!</span>
                  </span>
                )}
              </div>

              <form onSubmit={handleAddLink} className="space-y-4">
                {/* Trimester Selector (3 Trimestres) */}
                <div>
                  <label className="block text-xs font-semibold mb-1.5 text-neutral-200">
                    Selecione o Trimestre do Site:
                  </label>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    {config.categories.map(cat => {
                      const isSelected = selectedCategoryId === cat.id;
                      return (
                        <button
                          key={cat.id}
                          type="button"
                          onClick={() => setSelectedCategoryId(cat.id)}
                          className={`px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border transition-all cursor-pointer ${
                            isSelected
                              ? "bg-indigo-600 text-white border-transparent shadow-md scale-[1.02]"
                              : "bg-neutral-950 border-neutral-800 text-neutral-300 hover:bg-neutral-800 hover:text-white"
                          }`}
                        >
                          <span className={`w-2 h-2 rounded-full ${isSelected ? "bg-white" : "bg-indigo-500"}`} />
                          <span>{cat.name}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Title & URL inputs */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium mb-1 text-neutral-300">
                      Nome / Título do Site *
                    </label>
                    <input
                      type="text"
                      required
                      value={title}
                      onChange={e => setTitle(e.target.value)}
                      placeholder="Ex: Sistema Comercial, Landing Page..."
                      className="w-full px-3.5 py-2.5 rounded-xl text-sm bg-neutral-950 border border-neutral-800 text-neutral-100 placeholder:text-neutral-500 focus:border-indigo-500 outline-none transition-all"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium mb-1 text-neutral-300">
                      Link / URL do Site *
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        required
                        value={url}
                        onChange={e => setUrl(e.target.value)}
                        placeholder="meusite.com ou https://..."
                        className="w-full pl-3.5 pr-8 py-2.5 rounded-xl text-sm bg-neutral-950 border border-neutral-800 text-neutral-100 placeholder:text-neutral-500 focus:border-indigo-500 outline-none transition-all"
                      />
                      <Icon name="ExternalLink" className="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 opacity-40 pointer-events-none" />
                    </div>
                  </div>
                </div>

                {/* Description */}
                <div>
                  <label className="block text-xs font-medium mb-1 text-neutral-300">
                    Descrição Curta (Opcional)
                  </label>
                  <input
                    type="text"
                    value={description}
                    onChange={e => setDescription(e.target.value)}
                    placeholder="Ex: Sistema completo para gestão e relatórios em tempo real"
                    className="w-full px-3.5 py-2 rounded-xl text-xs bg-neutral-950 border border-neutral-800 text-neutral-100 placeholder:text-neutral-500 focus:border-indigo-500 outline-none transition-all"
                  />
                </div>

                {/* Quick Icon Picker */}
                <div>
                  <label className="block text-xs font-medium mb-1.5 text-neutral-300">
                    Ícone do Site:
                  </label>
                  <div className="flex flex-wrap gap-2">
                    {QUICK_ICONS.map(ic => {
                      const isSel = selectedIcon === ic.id;
                      return (
                        <button
                          key={ic.id}
                          type="button"
                          onClick={() => setSelectedIcon(ic.id)}
                          className={`px-2.5 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 border transition-all cursor-pointer ${
                            isSel
                              ? "bg-indigo-600 text-white border-transparent shadow-sm scale-105"
                              : "bg-neutral-950 border-neutral-800 text-neutral-300 hover:bg-neutral-800 hover:text-white"
                          }`}
                        >
                          <Icon name={ic.id} className="w-3.5 h-3.5" />
                          <span>{ic.label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Toggle advanced */}
                <div>
                  <button
                    type="button"
                    onClick={() => setShowAdvanced(!showAdvanced)}
                    className="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 cursor-pointer"
                  >
                    <span>{showAdvanced ? "▲ Ocultar opções adicionais" : "▼ Mais opções (Selo/Badge, tags)"}</span>
                  </button>

                  {showAdvanced && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3 pt-3 border-t border-neutral-800/80">
                      <div>
                        <label className="block text-xs font-medium mb-1 text-neutral-300">
                          Selo / Badge (opcional)
                        </label>
                        <input
                          type="text"
                          value={badge}
                          onChange={e => setBadge(e.target.value)}
                          placeholder="Ex: Novo, Online, Destaque"
                          className="w-full px-3 py-2 rounded-xl text-xs bg-neutral-950 border border-neutral-800 text-neutral-200 outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium mb-1 text-neutral-300">
                          Tags (separadas por vírgula)
                        </label>
                        <input
                          type="text"
                          value={tagsText}
                          onChange={e => setTagsText(e.target.value)}
                          placeholder="React, TypeScript, Node..."
                          className="w-full px-3 py-2 rounded-xl text-xs bg-neutral-950 border border-neutral-800 text-neutral-200 outline-none"
                        />
                      </div>
                    </div>
                  )}
                </div>

                {/* Submit button */}
                <button
                  type="submit"
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  <Icon name="Plus" className="w-4 h-4" />
                  <span>Adicionar Site no Portfólio</span>
                </button>
              </form>
            </div>

            {/* Navigation & Search */}
            <div className="space-y-4 mb-6">
              {/* Search */}
              <div className="relative">
                <Icon name="Search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-500" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Buscar sites, ferramentas ou tags..."
                  className="w-full pl-10 pr-10 py-2.5 rounded-2xl text-sm bg-neutral-900/90 border border-neutral-800 text-neutral-100 placeholder:text-neutral-500 focus:border-indigo-500 outline-none transition-all"
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery("")}
                    className="absolute right-3.5 top-1/2 -translate-y-1/2 p-1 rounded-lg hover:bg-neutral-800 text-neutral-400 hover:text-white"
                  >
                    <Icon name="X" className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>

              {/* Trimester Pills */}
              <div className="flex items-center gap-2 overflow-x-auto pb-1">
                <button
                  onClick={() => setActiveCategory("all")}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-1.5 border shrink-0 cursor-pointer ${
                    activeCategory === "all"
                      ? "bg-indigo-600 text-white border-transparent shadow-sm"
                      : "bg-neutral-900/60 border-neutral-800 text-neutral-400 hover:bg-neutral-800 hover:text-neutral-200"
                  }`}
                >
                  <Icon name="Layers" className="w-3.5 h-3.5" />
                  <span>Todos os Trimestres ({config.links.length})</span>
                </button>

                {config.categories.map(cat => {
                  const isActive = activeCategory === cat.id;
                  const count = config.links.filter(l => l.categoryId === cat.id).length;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => setActiveCategory(cat.id)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-1.5 border shrink-0 cursor-pointer ${
                        isActive
                          ? "bg-indigo-600 text-white border-transparent shadow-sm"
                          : "bg-neutral-900/60 border-neutral-800 text-neutral-400 hover:bg-neutral-800 hover:text-neutral-200"
                      }`}
                    >
                      <Icon name="Calendar" className="w-3.5 h-3.5" />
                      <span>{cat.name} ({count})</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Links Content */}
            <div className="space-y-8">
              {searchQuery && filteredLinks.length === 0 ? (
                <div className="text-center py-12 px-4 rounded-3xl border border-neutral-800 bg-neutral-900/40">
                  <h4 className="text-base font-bold text-neutral-300 mb-1">Nenhum site encontrado</h4>
                  <p className="text-xs text-neutral-400 mb-4">Não encontramos nenhum resultado para "{searchQuery}".</p>
                  <button
                    onClick={() => setSearchQuery("")}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold"
                  >
                    Limpar busca
                  </button>
                </div>
              ) : shouldGroupByCategory ? (
                /* Grouped by Trimester */
                config.categories.map(cat => {
                  const catLinks = config.links.filter(l => l.categoryId === cat.id);
                  return (
                    <section key={cat.id} className="space-y-3.5">
                      <div className="flex items-center justify-between px-1">
                        <div className="flex items-center gap-2.5">
                          <div className="w-2.5 h-2.5 rounded-full bg-indigo-500 ring-4 ring-indigo-500/20" />
                          <h3 className="text-base font-bold text-neutral-200">{cat.name}</h3>
                          <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full border ${
                            catLinks.length > 0
                              ? "bg-indigo-500/20 border-indigo-500/40 text-indigo-300"
                              : "bg-neutral-800/60 border-neutral-700 text-neutral-400"
                          }`}>
                            {catLinks.length} {catLinks.length === 1 ? "site" : "sites"}
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={() => handleAddInTrimester(cat.id)}
                          className="text-xs font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1 cursor-pointer"
                        >
                          <Icon name="Plus" className="w-3.5 h-3.5" />
                          <span>Adicionar no {cat.name}</span>
                        </button>
                      </div>

                      {catLinks.length > 0 ? (
                        <div className={layoutStyle === "cards" ? "grid grid-cols-1 sm:grid-cols-2 gap-4" : "flex flex-col gap-2.5"}>
                          {catLinks.map(link => (
                            <LinkCardItem
                              key={link.id}
                              link={link}
                              categoryName={cat.name}
                              layoutStyle={layoutStyle}
                              copiedId={copiedId}
                              onCopy={handleCopyLink}
                              onDelete={handleDeleteLink}
                            />
                          ))}
                        </div>
                      ) : (
                        <div className="py-7 px-4 rounded-2xl border border-dashed border-neutral-800/90 bg-neutral-900/30 text-center flex flex-col items-center justify-center gap-2">
                          <p className="text-xs text-neutral-400">
                            Nenhum site adicionado no <strong className="text-neutral-300">{cat.name}</strong> ainda.
                          </p>
                          <button
                            type="button"
                            onClick={() => handleAddInTrimester(cat.id)}
                            className="px-3 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 text-xs font-semibold inline-flex items-center gap-1.5 transition-all cursor-pointer"
                          >
                            <Icon name="Plus" className="w-3.5 h-3.5" />
                            <span>Adicionar site no {cat.name}</span>
                          </button>
                        </div>
                      )}
                    </section>
                  );
                })
              ) : (
                /* Single category or search view */
                filteredLinks.length === 0 ? (
                  <div className="text-center py-12 px-4 rounded-3xl border border-neutral-800 bg-neutral-900/40">
                    <h4 className="text-base font-bold text-neutral-300 mb-1">Nenhum site neste trimestre</h4>
                    <p className="text-xs text-neutral-400 mb-4">Você ainda não adicionou sites neste trimestre.</p>
                    <button
                      onClick={() => handleAddInTrimester(activeCategory)}
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer"
                    >
                      Adicionar site agora
                    </button>
                  </div>
                ) : (
                  <div className={layoutStyle === "cards" ? "grid grid-cols-1 sm:grid-cols-2 gap-4" : "flex flex-col gap-2.5"}>
                    {filteredLinks.map(link => {
                      const cat = config.categories.find(c => c.id === link.categoryId);
                      return (
                        <LinkCardItem
                          key={link.id}
                          link={link}
                          categoryName={cat?.name}
                          layoutStyle={layoutStyle}
                          copiedId={copiedId}
                          onCopy={handleCopyLink}
                          onDelete={handleDeleteLink}
                        />
                      );
                    })}
                  </div>
                )
              )}
            </div>

            {/* Footer */}
            <footer className="mt-16 pt-8 border-t border-neutral-800/80 text-center text-xs text-neutral-500 space-y-3">
              <p>
                {config.profile.name} • {config.profile.role} • {config.profile.location}
              </p>
              <div className="flex items-center justify-center gap-4">
                <button
                  type="button"
                  onClick={handleDownloadStandalone}
                  className="text-indigo-400 hover:text-indigo-300 hover:underline cursor-pointer flex items-center gap-1"
                >
                  <Icon name="Download" className="w-3 h-3" />
                  <span>Baixar index.html autônomo</span>
                </button>
                <span>•</span>
                <button
                  type="button"
                  onClick={() => {
                    if (confirm("Deseja restaurar para o modelo inicial?")) {
                      localStorage.removeItem(STORAGE_KEY);
                      setConfig(DEFAULT_PORTFOLIO);
                    }
                  }}
                  className="hover:text-red-400 transition-colors cursor-pointer"
                >
                  Restaurar padrão
                </button>
              </div>
            </footer>
          </main>
        </div>
      );
    }

    // Link Card Item Component
    function LinkCardItem({ link, categoryName, layoutStyle, copiedId, onCopy, onDelete }) {
      let domain = "";
      try {
        domain = new URL(link.url).hostname.replace(/^www\./, "");
      } catch (e) {
        domain = link.url;
      }

      const isCopied = copiedId === link.id;

      if (layoutStyle === "compact") {
        return (
          <div className="p-3.5 rounded-2xl border border-neutral-800 bg-neutral-900/60 hover:border-neutral-700 hover:bg-neutral-900 transition-all flex items-center justify-between gap-3 group">
            <a
              href={link.url}
              target="_blank"
              rel="noopener noreferrer"
              className="flex items-center gap-3 min-w-0 flex-1"
            >
              <div className="w-9 h-9 rounded-xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                <Icon name={link.icon || "Globe"} className="w-4 h-4" />
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <h4 className="text-sm font-bold text-neutral-100 truncate group-hover:text-indigo-400 transition-colors">
                    {link.title}
                  </h4>
                  {link.badge && (
                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 shrink-0">
                      {link.badge}
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-neutral-400 truncate">{domain}</p>
              </div>
            </a>

            <div className="flex items-center gap-1 shrink-0">
              <button
                type="button"
                onClick={() => onCopy(link.url, link.id)}
                className="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-800 transition-all"
                title="Copiar URL"
              >
                {isCopied ? <Icon name="Check" className="w-4 h-4 text-emerald-400" /> : <Icon name="Copy" className="w-4 h-4" />}
              </button>
              <button
                type="button"
                onClick={() => onDelete(link.id)}
                className="p-2 rounded-xl text-neutral-400 hover:text-red-400 hover:bg-red-500/10 transition-all"
                title="Remover site"
              >
                <Icon name="Trash2" className="w-4 h-4" />
              </button>
              <a
                href={link.url}
                target="_blank"
                rel="noopener noreferrer"
                className="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-800 transition-all"
                title="Abrir site"
              >
                <Icon name="ExternalLink" className="w-4 h-4" />
              </a>
            </div>
          </div>
        );
      }

      return (
        <div className="p-5 rounded-3xl border border-neutral-800 bg-neutral-900/60 hover:border-neutral-700 hover:bg-neutral-900/80 transition-all flex flex-col justify-between group relative overflow-hidden shadow-lg">
          <div>
            <div className="flex items-start justify-between gap-3 mb-3">
              <div className="w-11 h-11 rounded-2xl bg-indigo-600/15 border border-indigo-500/25 text-indigo-400 flex items-center justify-center shrink-0">
                <Icon name={link.icon || "Globe"} className="w-5 h-5" />
              </div>

              <div className="flex items-center gap-1">
                <button
                  type="button"
                  onClick={() => onCopy(link.url, link.id)}
                  className="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-800 transition-all"
                  title="Copiar URL"
                >
                  {isCopied ? <Icon name="Check" className="w-4 h-4 text-emerald-400" /> : <Icon name="Copy" className="w-4 h-4" />}
                </button>
                <button
                  type="button"
                  onClick={() => onDelete(link.id)}
                  className="p-2 rounded-xl text-neutral-400 hover:text-red-400 hover:bg-red-500/10 transition-all"
                  title="Remover site"
                >
                  <Icon name="Trash2" className="w-4 h-4" />
                </button>
              </div>
            </div>

            <a
              href={link.url}
              target="_blank"
              rel="noopener noreferrer"
              className="block group-hover:text-indigo-400 transition-colors"
            >
              <div className="flex items-center gap-2 mb-1">
                <h4 className="text-base font-bold text-neutral-100 group-hover:text-indigo-400 transition-colors">
                  {link.title}
                </h4>
                {link.badge && (
                  <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 shrink-0">
                    {link.badge}
                  </span>
                )}
              </div>

              {link.description && (
                <p className="text-xs text-neutral-400 line-clamp-2 mb-3">
                  {link.description}
                </p>
              )}
            </a>

            {link.tags && link.tags.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mb-3">
                {link.tags.map((t, idx) => (
                  <span key={idx} className="text-[10px] px-2 py-0.5 rounded-md bg-neutral-800 text-neutral-400">
                    #{t}
                  </span>
                ))}
              </div>
            )}
          </div>

          <div className="pt-3 border-t border-neutral-800/60 flex items-center justify-between text-xs text-neutral-400 mt-2">
            <span className="truncate max-w-[160px] font-mono text-[11px] opacity-70">
              {domain}
            </span>

            <a
              href={link.url}
              target="_blank"
              rel="noopener noreferrer"
              className="font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1 group/btn"
            >
              <span>Acessar</span>
              <Icon name="ExternalLink" className="w-3.5 h-3.5 group-hover/btn:translate-x-0.5 group-hover/btn:-translate-y-0.5 transition-transform" />
            </a>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
